services:
  mysql:
    image: mysql:8.0
    container_name: iptv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: iptv_root_password
      MYSQL_DATABASE: iptv_manager
      MYSQL_USER: iptv_user
      MYSQL_PASSWORD: iptv_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - iptv-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "iptv_user", "-piptv_password"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: iptv-phpmyadmin
    restart: unless-stopped
    profiles:
      - debug
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: iptv_root_password
      MYSQL_ROOT_PASSWORD: iptv_root_password
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - mysql
    networks:
      - iptv-network

volumes:
  mysql_data:

networks:
  iptv-network:
    driver: bridge
